name: Nova Benefits
description: >-
  Nova Benefits is an India-based employee health and benefits platform that
  provides group health insurance, super top-up plans, and COVID-19 cover
  alongside wellness services such as telehealth consultations, mental-wellness
  support, fitness programs, maternity benefits, and annual health, dental and
  vision checkups. It gives HR teams an employer dashboard for administering
  benefits and managing claims, and gives employees web and mobile (iOS/Android)
  apps to view coverage, book consultations, and file and track claims. The
  company reports serving 500+ companies covering 200,000+ employees, is
  ISO 27001:2022 certified and SOC 2 Type II compliant, and operates as an
  IRDAI-regulated insurance broker. Nova Benefits publishes no public API or
  developer platform.
